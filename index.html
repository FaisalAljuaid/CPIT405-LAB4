<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIT-405 | Lab 4</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 32px;
            margin-bottom: 25px;
            color: #000;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            margin-bottom: 6px;
            color: #111;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            color: #333;
        }

        input::placeholder,
        textarea::placeholder {
            color: #999;
            font-size: 14px;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .submit-btn:hover {
            background-color: #222222;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Great Auto Parts - Order Form</h1>

    <form action="#" method="post">
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first_name" placeholder="Enter your first name">

        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last_name" placeholder="Enter your last name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address">

        <label for="phone">Phone number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

        <label for="make">Make:</label>
        <input type="text" id="make" name="make" placeholder="Make">

        <label for="model">Model:</label>
        <input type="text" id="model" name="model" placeholder="Model">

        <label for="year">Year:</label>
        <input type="number" id="year" name="year" placeholder="Year">

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <label for="spare-part">Spare Part:</label>
        <input type="text" id="spare-part" name="spare_part" placeholder="Enter the spare part you need">

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" placeholder="Enter the quantity of the spare part you need">

        <label for="comment">Comment:</label>
        <textarea id="comment" name="comment" placeholder="Enter your comment"></textarea>

        <input type="submit" value="Submit" class="submit-btn">
    </form>
</div>

</body>
</html>
